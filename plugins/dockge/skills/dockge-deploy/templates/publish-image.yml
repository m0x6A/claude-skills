# .github/workflows/publish-image.yml — build the app's image and push it to GHCR.
# Every push to main publishes ghcr.io/<owner>/<repo>:sha-<short> (what deploys pin)
# and :latest (for convenience only).
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest # or [self-hosted, <label>] from the profile; needs Docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tag
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        shell: bash
        run: echo "Published \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >>"$GITHUB_STEP_SUMMARY"
