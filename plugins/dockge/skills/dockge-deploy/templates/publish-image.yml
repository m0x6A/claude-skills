# .github/workflows/publish-image.yml — build the app's image and push it to GHCR.
# Every push to main publishes ghcr.io/<owner>/<repo>:sha-<short> (what deploys pin)
# and :latest (for convenience only).
# Actions are pinned to commit SHAs because this job can write packages.
# On a self-hosted runner in a public repo, never add pull_request or
# pull_request_target triggers: fork PRs would run code on your runner.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest # or [self-hosted, <label>] from the profile; needs Docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tag
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        shell: bash
        run: echo "Published \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >>"$GITHUB_STEP_SUMMARY"
